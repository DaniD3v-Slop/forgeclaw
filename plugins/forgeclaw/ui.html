<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForgeClaw triggers</title>
  <style>
    :root { color-scheme: dark; --bg:#101216; --panel:#181b21; --panel2:#20242c; --text:#f4f5f7; --muted:#9ba3af; --line:#303641; --accent:#ff6b35; --accent2:#ff8a5c; --danger:#ef6060; --ok:#48b982; --radius:14px; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); }
    main { max-width:980px; margin:0 auto; padding:32px 28px; }
    header { display:flex; gap:24px; justify-content:space-between; align-items:flex-start; margin-bottom:26px; }
    h1 { margin:0 0 7px; font-size:27px; letter-spacing:-.03em; }
    .intro { margin:0; color:var(--muted); line-height:1.5; }
    button,select,input { font:inherit; }
    button { border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:10px; padding:9px 13px; cursor:pointer; }
    button:hover { border-color:#596170; }
    button.primary { border-color:var(--accent); background:var(--accent); color:#17100d; font-weight:700; }
    button.primary:hover { background:var(--accent2); }
    button.ghost { background:transparent; }
    button.danger { color:#ff9494; }
    button.small { padding:6px 9px; font-size:13px; }
    .actions { display:flex; gap:9px; align-items:center; flex-shrink:0; }
    #status { min-height:22px; margin:0 0 14px; color:var(--muted); font-size:14px; }
    #status.ok { color:var(--ok); } #status.error { color:#ff8b8b; }
    #empty { border:1px dashed var(--line); border-radius:var(--radius); padding:36px; color:var(--muted); text-align:center; }
    .trigger { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); margin:0 0 14px; overflow:hidden; }
    .trigger.disabled { opacity:.66; }
    .trigger-head { display:grid; grid-template-columns:auto minmax(230px,1fr) auto; gap:14px; align-items:center; padding:16px 17px; }
    .event-copy { min-width:0; }
    .event-select { width:100%; background:transparent; color:var(--text); border:0; padding:0; font-weight:700; font-size:16px; outline:0; }
    .event-select option, select option { background:#20242c; }
    .event-description { color:var(--muted); font-size:13px; margin-top:4px; }
    .switch { position:relative; width:40px; height:23px; display:inline-block; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; inset:0; border-radius:99px; background:#464d59; transition:.15s; }
    .slider:before { content:""; position:absolute; width:17px; height:17px; left:3px; top:3px; border-radius:50%; background:white; transition:.15s; }
    .switch input:checked + .slider { background:var(--accent); }
    .switch input:checked + .slider:before { transform:translateX(17px); }
    .trigger-body { border-top:1px solid var(--line); padding:15px 17px 17px; }
    .filter-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
    .filter-title strong { font-size:13px; letter-spacing:.02em; }
    .hint { color:var(--muted); font-size:12px; }
    .clause { border-left:2px solid #3b424e; padding:2px 0 2px 13px; margin-top:12px; }
    .clause-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; color:var(--muted); font-size:12px; }
    .condition { display:grid; grid-template-columns:minmax(145px,1fr) 112px minmax(150px,1.4fr) auto; gap:8px; margin-top:8px; }
    select,input[type=text] { width:100%; min-width:0; color:var(--text); background:#11141a; border:1px solid var(--line); border-radius:9px; padding:8px 9px; outline:0; }
    select:focus,input:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(255,107,53,.14); }
    .or { display:flex; align-items:center; gap:10px; margin:13px 0 2px; color:var(--muted); font-size:11px; font-weight:700; }
    .or:before,.or:after { content:""; height:1px; background:var(--line); flex:1; }
    .footer-actions { display:flex; gap:8px; margin-top:13px; }
    @media (max-width:680px) { main{padding:24px 14px} header{display:block}.actions{margin-top:16px}.trigger-head{grid-template-columns:auto 1fr auto}.condition{grid-template-columns:1fr 100px}.condition .value{grid-column:1 / 3}.condition .remove-condition{grid-column:3;grid-row:1 / 3} }
    @media (prefers-color-scheme:light) { :root { color-scheme:light; --bg:#f5f5f3; --panel:#fff; --panel2:#f1f1ee; --text:#242526; --muted:#686e76; --line:#dcddd9; } .event-select,select,input[type=text]{color:var(--text)} select,input[type=text]{background:#fafaf8}.event-select option,select option{background:white} }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Forge triggers</h1><p class="intro">Choose when ForgeClaw starts work. Conditions in a group are all required; alternative groups match independently.</p></div>
    <div class="actions"><button id="add">Add trigger</button><button id="save" class="primary">Save changes</button></div>
  </header>
  <div id="status" role="status"></div>
  <section id="triggers"></section>
  <div id="empty" hidden>No triggers yet. Add one to start a workflow.</div>
</main>
<datalist id="identity-values"><option value="@me"><option value="!@me"></datalist>
<script>
const EVENTS = {
  "comment.created": { title:"New comment", description:"Answer mentions and conversations on assigned work.", fields:{mentions:"Mentions",assignees:"Assigned to",author:"Comment author",body:"Comment text"} },
  "issue.assigned": { title:"Issue assigned", description:"Implement or answer newly assigned issues.", fields:{assignees:"Assigned to",author:"Issue author"} },
  "pull_request.review_requested": { title:"Review requested", description:"Review a pull request when ForgeClaw is requested.", fields:{reviewer:"Requested reviewer",author:"Pull request author"} },
  "pull_request.changes_requested": { title:"Changes requested", description:"Update a pull request after a request-changes review.", fields:{reviewer:"Review author",body:"Review text"} },
  "ci.run_completed": { title:"CI run completed", description:"Investigate completed CI runs, usually failures.", fields:{conclusion:"Conclusion",pr_author:"Pull request author",workflow:"Workflow file"} },
  "pull_request.opened": { title:"Pull request opened", description:"Optionally review newly opened pull requests.", fields:{author:"Pull request author"} }
};
const CSRF="__FORGECLAW_CSRF__";
const request=(url,options={})=>fetch(url,{credentials:"include",...options});
const defaults = {
  "comment.created": {mentions:"@me",author:"!@me"}, "issue.assigned":{assignees:"@me",author:"!@me"},
  "pull_request.review_requested":{reviewer:"@me"}, "pull_request.changes_requested":{reviewer:"!@me"},
  "ci.run_completed":{conclusion:"failure",pr_author:"@me"}, "pull_request.opened":{author:"@me"}
};
let triggers=__FORGECLAW_TRIGGERS__;
const $=(s,root=document)=>root.querySelector(s);
function esc(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function clauses(trigger){if(trigger.filter===undefined)return [];return Array.isArray(trigger.filter)?trigger.filter:[trigger.filter];}
function setClauses(trigger,list){if(list.length===0)delete trigger.filter;else trigger.filter=list.length===1?list[0]:list;}
function options(entries,selected){return Object.entries(entries).map(([value,label])=>`<option value="${esc(value)}" ${value===selected?"selected":""}>${esc(label)}</option>`).join("");}
function render(){
  $("#empty").hidden=triggers.length!==0;
  $("#triggers").innerHTML=triggers.map((trigger,ti)=>{
    const event=EVENTS[trigger.on];
    const groups=clauses(trigger);
    return `<article class="trigger ${trigger.enabled===false?"disabled":""}" data-trigger="${ti}">
      <div class="trigger-head"><label class="switch" title="Enable trigger"><input class="enabled" type="checkbox" ${trigger.enabled===false?"":"checked"}><span class="slider"></span></label>
      <div class="event-copy"><select class="event-select">${options(Object.fromEntries(Object.entries(EVENTS).map(([k,v])=>[k,v.title])),trigger.on)}</select><div class="event-description">${esc(event.description)}</div></div>
      <button class="ghost danger remove-trigger" title="Delete trigger" aria-label="Delete trigger">Delete</button></div>
      <div class="trigger-body"><div class="filter-title"><strong>Run only when</strong><span class="hint">No conditions means every ${esc(event.title.toLowerCase())} event</span></div>
      <div class="groups">${groups.map((group,gi)=>`${gi?'<div class="or">OR</div>':''}<div class="clause" data-group="${gi}"><div class="clause-head"><span>All of these conditions</span>${groups.length>1?'<button class="small ghost remove-group">Remove group</button>':''}</div>${Object.entries(group).map(([field,pattern],ci)=>condition(event,field,pattern,ci)).join("")}<button class="small ghost add-condition">Add condition</button></div>`).join("")}</div>
      <div class="footer-actions">${groups.length===0?'<button class="small ghost add-condition-empty">Add condition</button>':'<button class="small ghost add-group">Add alternative (OR)</button>'}</div></div></article>`;
  }).join("");
}
function condition(event,field,pattern,ci){const negative=pattern.startsWith("!");const value=negative?pattern.slice(1):pattern;return `<div class="condition" data-condition="${ci}"><select class="field">${options(event.fields,field)}</select><select class="operator"><option value="is" ${negative?"":"selected"}>is</option><option value="not" ${negative?"selected":""}>is not</option></select><input class="value" type="text" value="${esc(value)}" placeholder="Value or @me" list="identity-values"><button class="small ghost danger remove-condition" aria-label="Remove condition">Remove</button></div>`;}
function sync(){document.querySelectorAll(".trigger").forEach(card=>{const ti=+card.dataset.trigger;const trigger=triggers[ti];trigger.on=$(".event-select",card).value;trigger.enabled=$(".enabled",card).checked;const groups=[];card.querySelectorAll(".clause").forEach(group=>{const clause={};group.querySelectorAll(".condition").forEach(row=>{const field=$(".field",row).value;const value=$(".value",row).value.trim();if(field&&value)clause[field]=($(".operator",row).value==="not"?"!":"")+value;});groups.push(clause);});if(groups.length===0)delete trigger.filter;else trigger.filter=groups.length===1?groups[0]:groups; if(trigger.enabled)delete trigger.enabled;});}
function setStatus(text,kind=""){const el=$("#status");el.textContent=text;el.className=kind;}
$("#triggers").addEventListener("change",e=>{sync();const card=e.target.closest(".trigger");if(e.target.matches(".event-select")){const ti=+card.dataset.trigger;triggers[ti].filter={...(defaults[triggers[ti].on]??{})};render();}else if(e.target.matches(".enabled")){render();}});
$("#triggers").addEventListener("click",e=>{const card=e.target.closest(".trigger");if(!card)return;const row=e.target.closest(".condition");const rowField=row?$(".field",row).value:null;sync();const ti=+card.dataset.trigger;const group=e.target.closest(".clause");if(e.target.closest(".remove-trigger"))triggers.splice(ti,1);else if(e.target.closest(".add-condition-empty")){const field=Object.keys(EVENTS[triggers[ti].on]?.fields??{})[0]??"author";triggers[ti].filter={[field]:defaults[triggers[ti].on]?.[field]??"@me"};}else if(e.target.closest(".add-group")){const list=clauses(triggers[ti]);const field=Object.keys(EVENTS[triggers[ti].on]?.fields??{})[0]??"author";setClauses(triggers[ti],[...list,{[field]:defaults[triggers[ti].on]?.[field]??"@me"}]);}else if(e.target.closest(".remove-group")){const list=clauses(triggers[ti]);list.splice(+group.dataset.group,1);setClauses(triggers[ti],list);}else if(e.target.closest(".add-condition")){const list=clauses(triggers[ti]);const fields=Object.keys(EVENTS[triggers[ti].on]?.fields??{});const field=fields.find(f=>!(f in list[+group.dataset.group]));if(field)list[+group.dataset.group][field]=defaults[triggers[ti].on]?.[field]??"@me";setClauses(triggers[ti],list);}else if(e.target.closest(".remove-condition")){const list=clauses(triggers[ti]);const gi=+group.dataset.group;delete list[gi][rowField];if(Object.keys(list[gi]).length===0)list.splice(gi,1);setClauses(triggers[ti],list);}else return;render();});
$("#add").addEventListener("click",()=>{sync();triggers.push({on:"comment.created",filter:{...defaults["comment.created"]}});render();});
$("#save").addEventListener("click",async()=>{sync();setStatus("Saving…");try{const response=await request("/api/forgeclaw/config",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({csrf:CSRF,triggers})});const body=await response.json();if(!response.ok)throw new Error(body.error||`HTTP ${response.status}`);triggers=body.triggers;render();setStatus("Saved. New forge events use these triggers immediately.","ok");}catch(error){setStatus(`Could not save: ${error.message}`,"error");}});
render();
</script>
</body>
</html>
