services:
  mock-model:
    profiles: [mock]
    image: ghcr.io/openclaw/openclaw:2026.9.6-browser
    command: ["node", "/mock/model.mjs"]
    volumes:
      - ./mock/model.mjs:/mock/model.mjs:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  openclaw-mock-init:
    profiles: [mock]
    image: busybox:1.37
    command: ["sh", "-c", "cp /seed/openclaw.json /home/node/.openclaw/openclaw.json && chown -R 1000:1000 /workspace /home/node/.config/openclaw /home/node/.openclaw /home/node/.cache"]
    volumes:
      - ./mock/openclaw.json:/seed/openclaw.json:ro
      - mock_workspace:/workspace
      - mock_config:/home/node/.config/openclaw
      - mock_data:/home/node/.openclaw
      - mock_cache:/home/node/.cache

  openclaw-mock-gateway:
    profiles: [mock]
    image: ghcr.io/openclaw/openclaw:2026.9.6-browser
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan"]
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      FORGECLAW_MCP_AUTHORIZATION: ${FORGECLAW_MCP_AUTHORIZATION:-}
    volumes:
      - mock_config:/home/node/.config/openclaw
      - mock_data:/home/node/.openclaw
      - mock_cache:/home/node/.cache
      - mock_workspace:/workspace
      - ../plugins/forgeclaw:/home/node/.openclaw/extensions/forgeclaw:ro
    depends_on:
      openclaw-mock-init:
        condition: service_completed_successfully
      mock-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:18789/"]
      interval: 2s
      timeout: 2s
      retries: 30

  forgeclaw-mock:
    profiles: [mock]
    image: localhost/forgeclaw-forgeclaw:latest
    command: ["forgeclaw"]
    environment:
      FORGECLAW_FORGE_TOKEN: ${FORGECLAW_FORGE_TOKEN:-}
      FORGECLAW_FORGE_PASSWORD: ${FORGECLAW_FORGE_PASSWORD:-}
      FORGECLAW_WEBHOOK_SECRET: ${FORGECLAW_WEBHOOK_SECRET:-}
      FORGECLAW_MCP_AUTHORIZATION: ${FORGECLAW_MCP_AUTHORIZATION:-}
      OPENCLAW_GATEWAY_URL: ws://openclaw-mock-gateway:18789
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: "1"
    volumes:
      - mock_config:/home/node/.config/openclaw
      - mock_data:/home/node/.openclaw
      - mock_cache:/home/node/.cache
      - mock_workspace:/workspace
    depends_on:
      forgejo:
        condition: service_healthy
      openclaw-mock-gateway:
        condition: service_healthy
      openclaw-mock-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  mock-check:
    profiles: [mock]
    image: ghcr.io/openclaw/openclaw:2026.9.6-browser
    command: ["node", "/mock/check.mjs"]
    environment:
      FORGECLAW_FORGE_TOKEN: ${FORGECLAW_FORGE_TOKEN:-}
      FORGECLAW_FORGE_PASSWORD: ${FORGECLAW_FORGE_PASSWORD:-}
      FORGECLAW_WEBHOOK_SECRET: ${FORGECLAW_WEBHOOK_SECRET:-}
      FORGECLAW_MCP_AUTHORIZATION: ${FORGECLAW_MCP_AUTHORIZATION:-}
    volumes:
      - ./mock/check.mjs:/mock/check.mjs:ro
    depends_on:
      forgeclaw-mock:
        condition: service_healthy

volumes:
  mock_config:
  mock_data:
  mock_cache:
  mock_workspace:
