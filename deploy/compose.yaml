name: forgeclaw

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.4-rootless
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__server__ROOT_URL: http://localhost:${FORGEJO_PORT:-3001}/
      FORGEJO__webhook__ALLOWED_HOST_LIST: "*"
    ports:
      - "127.0.0.1:${FORGEJO_PORT:-3001}:3000"
    volumes:
      - forgejo_data:/var/lib/gitea
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  runner:
    profiles: ["ci"]
    image: code.forgejo.org/forgejo/runner:6
    user: "0:0"
    command:
      - sh
      - -c
      - |
        test -f /data/.runner || forgejo-runner register --no-interactive \
          --instance http://forgejo:3000 --name forgeclaw-runner \
          --token "$${FORGEJO_RUNNER_REGISTRATION_TOKEN}" \
          --labels ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-latest
        exec forgejo-runner daemon --config /config.yaml
    environment:
      DOCKER_HOST: unix:///run/user/1000/podman/podman.sock
      FORGEJO_RUNNER_REGISTRATION_TOKEN: ${FORGEJO_RUNNER_REGISTRATION_TOKEN:-}
    depends_on:
      forgejo:
        condition: service_healthy
    volumes:
      - runner_data:/data
      - ./runner-config.yaml:/config.yaml:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/run/user/1000/podman/podman.sock

  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:2026.8.2-browser
    command:
      - sh
      - -c
      - |
        node openclaw.mjs config set gateway.controlUi.allowedOrigins \
          '["http://127.0.0.1:${OPENCLAW_PORT:-18790}","http://localhost:${OPENCLAW_PORT:-18790}","http://127.0.0.1:18789"]' --json
        exec node openclaw.mjs gateway --bind lan
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      FORGECLAW_MCP_AUTHORIZATION: ${FORGECLAW_MCP_AUTHORIZATION:-}
    ports:
      - "127.0.0.1:${OPENCLAW_PORT:-18790}:18789"
    volumes:
      - openclaw_config:/home/node/.config/openclaw
      - openclaw_data:/home/node/.openclaw
      - openclaw_cache:/home/node/.cache
      - forgeclaw_workspace:/workspace
      - ../plugins/forgeclaw:/home/node/.openclaw/extensions/forgeclaw:ro
    depends_on:
      openclaw-init:
        condition: service_completed_successfully

  forgeclaw:
    build: ..
    command: ["forgeclaw"]
    environment:
      FORGECLAW_FORGE_TOKEN: ${FORGECLAW_FORGE_TOKEN:-}
      FORGECLAW_WEBHOOK_SECRET: ${FORGECLAW_WEBHOOK_SECRET:-}
      FORGECLAW_MCP_AUTHORIZATION: ${FORGECLAW_MCP_AUTHORIZATION:-}
      OPENCLAW_GATEWAY_URL: ws://openclaw-gateway:18789
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: "1"
    depends_on:
      forgejo:
        condition: service_healthy
      openclaw-gateway:
        condition: service_started
      openclaw-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${FORGECLAW_PORT:-3081}:3080"
    volumes:
      - openclaw_config:/home/node/.config/openclaw
      - openclaw_data:/home/node/.openclaw
      - openclaw_cache:/home/node/.cache
      - forgeclaw_workspace:/workspace

  # Seed the shared OpenClaw configuration once, then preserve UI edits in the
  # named volume on later starts.
  openclaw-init:
    image: busybox:1.37
    command:
      - sh
      - -c
      - |
        test -f /home/node/.openclaw/openclaw.json || cp /seed/openclaw.json /home/node/.openclaw/openclaw.json
        chown -R 1000:1000 /workspace /home/node/.config/openclaw /home/node/.openclaw /home/node/.cache
    volumes:
      - ./openclaw.json.example:/seed/openclaw.json:ro
      - forgeclaw_workspace:/workspace
      - openclaw_config:/home/node/.config/openclaw
      - openclaw_data:/home/node/.openclaw
      - openclaw_cache:/home/node/.cache

volumes:
  forgejo_data:
  openclaw_data:
  openclaw_config:
  openclaw_cache:
  forgeclaw_workspace:
  runner_data:

networks:
  default:
    name: forgeclaw
