[bot]
db_path = "forgebot.db"
listen = "[::]:8700"
resync_interval = "10m"
max_concurrent_tasks = 4
sandbox_kind = "podman"
work_root = "work"

[sandbox]
image = "localhost/forgebot-sandbox:latest"
nested = true

[limits]
max_attempts = 3
consecutive_failures_stop = 5
turn_timeout = "30m"

[triggers.implement-issue]
on = "issue.assigned"
filter = { assignee = "@me" }
prompt = "implement_issue"

[triggers.reply]
on = "comment.created"
filter = [
  { mentions = "@me", author = "!@me" },
  { assignees = "@me", author = "!@me" },
]
prompt = "reply"

[triggers.review]
on = "pull_request.review_requested"
filter = { reviewer = "@me" }
prompt = "review"

[triggers.ci-failed]
on = "ci.run_completed"
filter = { conclusion = "failure", pr_author = "@me" }
prompt = "ci_failed"

[triggers.referenced-pr-merged]
on = "issue.referenced_pr_merged"
filter = { issue_author = "@me" }
prompt = "close_if_resolved"

[triggers.unblocked]
on = "pull_request.unblocked"
filter = { author = "@me" }
prompt = "unblocked"

# Review the bot's own PRs. The session that wrote the code would review
# itself, so this stays opt-in per repo: [triggers.auto-review] enabled = true
[triggers.auto-review]
enabled = false
on = "pull_request.opened"
filter = { author = "@me" }
prompt = "review"

[prompts]
# Rendered once per fresh session, before the trigger prompt. Resumed
# sessions get only the trigger prompt — context already lives there.
context = """
You are @{{ me }}, a collaborator on {{ repo }}. The repository is checked
out in your working directory. Use the forge tools to act on the forge;
never post filler comments — every comment must carry information for a human.

If a tool you need to verify your work (compiler, formatter, test runner) is
missing from the sandbox, do not ship unverified code with a disclaimer.
Open an issue with create_issue asking an operator to update the forgebot
sandbox image to include it, open your PR as a draft (create_pr with
draft=true), and block it on that issue with block_on so it cannot merge
until the tool is available and the work is verified.

{{ subject }} — {{ title }}
{{ url }}

{{ body }}
{% if comments %}
{% for c in comments %}---
@{{ c.author }}:
{{ c.body }}
{% endfor %}{% endif %}{% if reviews %}
{% for rev in reviews %}=== review by @{{ rev.author }} ({{ rev.state }}) ===
{% if rev.body %}{{ rev.body }}
{% endif %}{% for c in rev.comments %}[{{ c.path }}{% if c.line %}:{{ c.line }}{% endif %}] @{{ c.author }}: {{ c.body }}
{% endfor %}{% endfor %}{% endif %}"""

implement_issue = """
You were assigned issue "{{ title }}" ({{ url }}). If it calls for code,
implement it in your working directory on a new branch, commit, push, and
open a pull request with create_pr. In the PR description say what you
changed and why, and any decision a reviewer will question — a separate
reviewer picks the PR up from that description and the diff, not from this
session. If the issue is a question or underspecified, reply with comment
instead — do not open a PR for something that needs discussion first."""

reply = """
{% if event.reply_to %}Review-thread comment{% else %}Comment{% endif %} by @{{ event.author }} on "{{ title }}"{% if event.url %} ({{ event.url }}){% endif %}:

{{ event.body }}

Respond to it — with a comment, a code change, or both, whatever it asks for.
{% if event.reply_to %}Reply in-thread via comment(reply_to={{ event.reply_to }}).{% endif %}"""

review = """
Review pull request "{{ title }}" ({{ url }}).
{% if diff %}
{{ diff }}
{% endif %}
Submit exactly one review with submit_review: verdict approve,
request_changes or comment, a short summary, and inline comments pinned to
the lines they concern. Post nothing outside that review."""

ci_failed = """
CI failed on your pull request "{{ title }}" ({{ url }}){% if event.workflow %} — workflow {{ event.workflow }}{% endif %}{% if event.run_url %}, run {{ event.run_url }}{% endif %}.
{% if ci_log %}
Log tail:
{{ ci_log }}
{% endif %}
Diagnose and fix it in your working directory, then push to the PR branch."""

close_if_resolved = """
Pull request #{{ event.pr }}{% if event.pr_title %} "{{ event.pr_title }}"{% endif %}{% if event.pr_url %} ({{ event.pr_url }}){% endif %}, which
references this issue, was merged. Check whether the issue is fully
resolved: if yes, close it with close_issue and a one-line note; if
something remains, comment what is still open instead."""

unblocked = """
The blockers on your pull request "{{ title }}" ({{ url }}) are now resolved —
the tooling you were waiting on should be available. Verify the work in your
working directory (compile, test, format as the repo needs) and push any fixes
to the PR branch. If it is ready, mark it ready for review by un-drafting it
with update_pr; if something is still missing, comment what remains instead."""

[responses]
# Posted by the bot itself when no agent ran at all.
abandoned = """
Gave up after {{ attempts }} attempts. Last error: `{{ error }}`. I won't
retry this until there is new activity here."""

# Posted once when a thread's abandoned deliveries reach the stop limit; from
# here the bot creates no new tasks on this thread until a delivery succeeds.
stopped = """
Too many consecutive failures on this thread — I'm pausing here and won't
pick up new events until an in-flight retry succeeds. Last error: `{{ error }}`."""

# Posted on the first failure when the agent can't authenticate — retrying
# won't help, an operator has to refresh my credentials.
auth_failed = """
I can't reach my model provider — my credentials need refreshing by an
operator. I won't retry until that's fixed. Last error: `{{ error }}`."""
